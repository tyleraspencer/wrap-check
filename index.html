<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111113">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Wrap Check</title>
<style>
  :root {
    --bg: #111113; --panel: #1a1a1d; --line: #2c2c31; --text: #ececef; --dim: #8e8e98;
    --accent: #3b82f6; --ok: #34c759; --warn: #ffb020; --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
  aside { order: 2; background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  h1 { font-size: 16px; margin: 0 0 14px; letter-spacing: .2px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin: 20px 0 8px; font-weight: 600; }
  .bar button { background: #232327; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; cursor: pointer; font: inherit; text-align: left; }
  select { width: 100%; background: #232327; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; }
  #preview { margin-bottom: 10px; cursor: pointer; }
  #preview .pv { border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
    background: conic-gradient(#2a2a2e 25%, #222226 0 50%, #2a2a2e 0 75%, #222226 0) 0 0/16px 16px; }
  #preview img { display: block; width: 100%; height: auto; }
  .btn { flex: 1; background: #232327; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  .btn:hover { border-color: #46464e; } .btn:disabled { opacity: .6; cursor: default; }
  #shareRow { display: flex; gap: 8px; margin: 0 0 8px; } #shareRow[hidden] { display: none; }
  #shareMsg { font-size: 12px; color: var(--dim); margin: 0 0 10px; min-height: 0; } #shareMsg:empty { display: none; } #shareMsg.err { color: var(--warn); }
  #previewName { font-size: 12px; color: var(--dim); margin-top: 6px; word-break: break-all; }
  .drop { border: 1.5px dashed #46464e; border-radius: 10px; padding: 18px 10px; text-align: center;
    color: var(--dim); cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--text); background: #1c2740; }
  .drop b { color: var(--text); }
  #checks { list-style: none; margin: 10px 0 0; padding: 0; }
  #checks li { display: flex; gap: 8px; padding: 4px 0; font-size: 13px; }
  #checks .dot { flex: none; width: 16px; height: 16px; border-radius: 50%; margin-top: 1px; text-align: center;
    font-size: 11px; line-height: 16px; color: #000; font-weight: 700; }
  .ok .dot { background: var(--ok); } .warn .dot { background: var(--warn); } .bad .dot { background: var(--bad); }
  #verdict:empty, #checks:empty { display: none; }
  #verdict { margin: 8px 0 14px; font-weight: 600; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid button { padding: 0; border: 2px solid transparent; border-radius: 6px; background: #000; cursor: pointer; overflow: hidden;
    aspect-ratio: 1; position: relative; }
  .grid button.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.45); }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 9px; padding: 8px 3px 2px;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); text-align: center; }
  main { position: relative; min-width: 0; }
  #car { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #1a1a1c; }
  .bar { position: absolute; left: 16px; right: 16px; bottom: 16px; margin: 0 auto; width: max-content; max-width: calc(100% - 32px);
    display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(2px, .4vw, 6px);
    background: rgba(26,26,29,.88); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 12px; padding: 6px; z-index: 2; }
  .bar button { text-align: center; padding: 7px clamp(4px, .8vw, 11px); font-size: clamp(10px, .95vw, 14px); white-space: nowrap; }
  .bar button.on { border-color: var(--accent); background: #1c2740; }
  #status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: #1a1a1c; z-index: 3; color: var(--dim); text-align: center; padding: 20px; }
  #status.hide { display: none; }
  .track { width: 220px; height: 4px; background: #2c2c31; border-radius: 2px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .embed .app { grid-template-columns: 1fr; } .embed aside, .embed .bar { display: none; }
  @media (max-width: 760px) {
    html, body { height: auto; }
    .app { display: flex; flex-direction: column; height: auto; }
    main { order: -1; flex: none; position: sticky; top: 0; height: 52vh; height: 52dvh; z-index: 5; border-bottom: 1px solid var(--line); }
    aside { overflow: visible; border-left: 0; padding: 14px 14px calc(28px + env(safe-area-inset-bottom)); }
    .bar { left: 8px; right: 8px; bottom: 8px; width: max-content; max-width: calc(100% - 16px); flex-wrap: nowrap; justify-content: flex-start;
           overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 6px; padding: 5px; }
    .bar::-webkit-scrollbar { display: none; }
    .bar button { flex: none; padding: 10px 13px; font-size: 14px; }
    #preview img { max-height: 190px; width: auto; max-width: 100%; margin: 0 auto; }
    .grid { grid-template-columns: repeat(4, 1fr); }
    .grid span { display: none; }
    select { padding: 12px 10px; font-size: 16px; }          /* 16px stops iOS zooming into the field */
    #status { padding: 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Wrap Check</h1>

    <h2>Vehicle</h2>
    <select id="cars" aria-label="Vehicle"></select>

    <h2>Your wrap</h2>
    <div id="preview" hidden title="Click to choose a different PNG">
      <div class="pv"><img id="previewImg" alt="Your wrap"></div>
      <div id="previewName"></div>
    </div>
    <div id="shareRow" hidden>
      <button class="btn" id="shareLink">Copy share link</button>
      <button class="btn" id="sharePng">Send PNG</button>
    </div>
    <div id="shareMsg"></div>
    <ul id="checks"></ul>
    <div id="verdict"></div>
    <div class="drop" id="drop"><b>Drop your PNG here</b><br><span id="dropSub">or click to choose</span><input id="file" type="file" accept="image/png" hidden></div>

    <h2>Tesla examples</h2>
    <div class="grid" id="examples"></div>
    <p class="hint">Examples load from teslamotors/custom-wraps for the selected vehicle.</p>
  </aside>

  <main>
    <iframe id="car" allow="fullscreen"></iframe>
    <div id="status"><div id="statusText">Loading…</div><div class="track"><div id="fill"></div></div>
      <div class="hint" id="statusHint"></div></div>
    <div class="bar" id="bar"></div>
  </main>
</div>

<script>
const RAW = 'https://raw.githubusercontent.com/teslamotors/custom-wraps/master';
// Address of the Wrap Check share service (share/worker.js on Cloudflare). Empty = sharing falls back to links that carry the image.
const SHARE_URL_DEFAULT = 'https://wrap-check-share.tyleraspencer.workers.dev';
const CARS = [
  { id: 'modely-2025-premium', pack: 'bayberry',     group: 'Model Y',   name: 'Premium',     sub: '2025+ (Juniper)' },
  { id: 'modely-2025-performance', pack: 'bayberry', group: 'Model Y',   name: 'Performance', sub: '2025+ (Juniper)' },
  { id: 'modely-2025-base', pack: 'bayberry-e41',        group: 'Model Y',   name: 'Standard',    sub: '2025+ (Juniper)' },
  { id: 'modely-l', pack: 'bayberry-e80',                group: 'Model Y',   name: 'Model Y L',   sub: '6-seat' },
  { id: 'modely', pack: 'y-high',                  group: 'Model Y',   name: 'Original',    sub: '2020–2024' },
  { id: 'model3-2024-base', pack: 'poppyseed',        group: 'Model 3',   name: 'Premium / Standard', sub: '2024+ (Highland)' },
  { id: 'model3-2024-performance', pack: 'poppyseed', group: 'Model 3',   name: 'Performance', sub: '2024+ (Highland)' },
  { id: 'model3', pack: '3-high',                  group: 'Model 3',   name: 'Original',    sub: '2017–2023' },
  { id: 'cybertruck', pack: 'cybertruck',              group: 'Cybertruck', name: 'Cybertruck', sub: 'All trims' },
];
const COMMON = `Acid_Drip Ani Apocalypse Avocado_Green Camo Cosmic_Burst Divide Doge Dot_Matrix Ice_Cream Leopard
Pixel_Art Reindeer Rudi Sakura Sketch String_Lights Valentine Vintage_Gradient Vintage_Stripes`.split(/\s+/);
const EXAMPLES_BY_CAR = {
  cybertruck: `Ani Camo_Blue Camo_Brown Camo_Green Camo_Pink Camo_Sand Camo_Snow Camo_Stealth Clay Cosmic_Burst
Digital_Camo_Green Digital_Camo_Snow Digital_Camo_Stealth Doge_Camo Gradient_Black Gradient_Burn Gradient_Cotton_Candy
Gradient_Green Gradient_Purple_Burn Gradient_Sunburst Graffiti_back Graffiti_green Graffiti_orange Grandmas_Sofa Houndstooth
Leopard Mika Rc_prototype Retro Rudi Rust Valentine Woody Xmas_Camo Xmas_Lights Xray`.split(/\s+/),
};
const examplesFor = id => EXAMPLES_BY_CAR[id] || COMMON;

const $ = id => document.getElementById(id);
const TOUCH = matchMedia('(hover: none)').matches;           // phones/tablets: no drag-and-drop
const dropText = hasWrap => TOUCH ? (hasWrap ? 'Choose a different PNG' : 'Tap to choose a PNG') : (hasWrap ? 'Drop a different PNG' : 'Drop your PNG here');
const frame = $('car');
const P = new URLSearchParams(location.search);
const EMBED = P.get('embed') === '1';                       // viewer only (used by the headless renderer)
if (EMBED) document.body.classList.add('embed');
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let car = P.get('car') || store.get('car') || CARS[0].id;
let pendingView = P.get('view');
if (!CARS.some(c => c.id === car)) car = CARS[0].id;
const templateSize = id => id === 'cybertruck' ? [1024, 768] : [1024, 1024];   // Tesla's template.png sizes
let rawTex = null, fixedTex = null;
let paint = P.get('paint') || 'PearlWhite';      // base paint under transparent parts of a wrap
let ready = false, carLoaded = false, loadedCar = null, texture = null, spinning = false;

let manifest = {};
const mb = b => (b / 1e6).toFixed(b < 1e7 ? 1 : 0) + ' MB';
const packSize = id => manifest[packOf(id)] ? mb(manifest[packOf(id)].bytes) : '';
const carName = id => { const c = CARS.find(c => c.id === id); return c.group === c.name ? c.name : `${c.group} ${c.name}`; };
const PACK_OVERRIDE = new URLSearchParams(location.search).get('pack');   // debug: ?pack=model-s
const packOf = id => PACK_OVERRIDE || CARS.find(c => c.id === id).pack;
const engineId = id => CARS.find(c => c.id === id).engine || id;       // S/X have no engine id of their own
let loadedPack = null, zoomDone = false;
const DEFAULT_VIEW = 'rear_right';               // what the engine shows before any angle is picked (horizontal 45)
let viewDirty = false;                          // the user dragged the car by hand, so the shared angle is only approximate
let initialView = null, currentView = null;      // initialView: from ?view= or a share link; currentView: last angle picked with the buttons
function loadViewer() {            // (re)start the engine on the selected car's pack
  ready = false; carLoaded = false; loadedCar = null; loadedPack = packOf(car); zoomDone = false;
  $('status').classList.remove('hide'); $('fill').style.width = '0';
  $('statusText').textContent = `Downloading ${carName(car)}…`;
  $('statusHint').textContent = packSize(car) ? `${packSize(car)} — cached after the first load` : '';
  frame.src = `godot/index.html?v=4&pck=${encodeURIComponent('packs/' + loadedPack + '.pck')}${P.get('touchGain') ? '&touchGain=' + encodeURIComponent(P.get('touchGain')) : ''}`;
}
const engineEvents = [];
// Camera views. horizontal: 0 = behind the car, 90 = its right side, 180 = in front, 270 = its left side (measured on the engine).
const VIEWS = {
  front:       { label: 'Front',        h: 180 }, front_left:  { label: 'Front L',  h: 225 }, left:  { label: 'Left',  h: 270 },
  rear_left:   { label: 'Rear L',       h: 315 }, rear:        { label: 'Rear',     h: 0 },   rear_right: { label: 'Rear R', h: 45 },
  right:       { label: 'Right',        h: 90 },  front_right: { label: 'Front R',  h: 135 }, top: { label: 'Top', preset: 'top' },
  three_quarter: { h: 225, alias: true },        // the usual hero angle (front, driver side)
};
const BAR = ['front', 'front_left', 'left', 'rear_left', 'rear', 'rear_right', 'right', 'front_right', 'top'];
// Camera distance. The engine's relative zoom is unpredictable, so frame with an absolute distance (3..12 in the engine).
// Wide viewers use the engine default (-1). Portrait viewers (phones) need the camera closer so the car fills the width:
// measured ~8.3 at a 0.89 aspect gives ~85% width, and distance scales with 1/aspect. The Cybertruck is bigger, so it sits further back.
const fitDistance = () => {
  const r = frame.clientWidth / Math.max(1, frame.clientHeight), ct = car === 'cybertruck';
  if (r >= 1) return ct ? 8.5 : -1;
  return Math.round(Math.min(12, Math.max(7, (7.4 / r) * (ct ? 1.3 : 1))) * 10) / 10;
};
const sentLog = [];                                   // last messages sent to the engine (see WrapCheck.state())
const send = m => { sentLog.push(m.type + (m.delta !== undefined ? ':' + m.delta : '')); if (sentLog.length > 40) sentLog.shift(); frame.contentWindow.postMessage(m, '*'); };

// ---- engine events ----
addEventListener('message', e => {
  if (e.source !== frame.contentWindow || !e.data || !e.data.type) return;
  const d = e.data;
  if (d.type !== 'godot_progress') engineEvents.push(d.type);
  if (d.type === 'godot_progress') {
    $('fill').style.width = Math.round(d.progress * 100) + '%';
    const tot = manifest[loadedPack] && manifest[loadedPack].bytes;
    if (tot) $('statusHint').textContent = `${mb(tot * d.progress)} of ${mb(tot)}`;
  } else if (d.type === 'godot_ready') {
    ready = true; nudgeSoon(); $('statusText').textContent = `Loading ${carName(car)}…`; syncCar();
  } else if (d.type === 'car_loaded') {
    carLoaded = true; nudgeSoon(); $('status').classList.add('hide');
    setTimeout(() => { sendPaint(); pushTexture(); send({ type: 'set_camera_auto_rotate', enabled: spinning }); if (!zoomDone) { zoomDone = true; if (initialView === 'rotate') { const d = fitDistance(); if (d > 0) send({ type: 'set_camera_angle', horizontal: 45, vertical: 15, distance: d }); setTimeout(() => send({ type: 'set_camera_auto_rotate', enabled: true }), 400); } else if (initialView) { currentView = initialView; markView(initialView); WrapCheck.camera(initialView, 300); } else { const d = fitDistance(); if (d > 0) send({ type: 'set_camera_angle', horizontal: 45, vertical: 15, distance: d }); } } }, 200);   // frame once per engine start; keeps the engine's default angle
  } else if (d.type === 'godot_error') {
    $('statusText').textContent = 'Engine error: ' + (d.message || 'unknown');
  }
});

function syncCar() {
  if (!ready || loadedCar === car) return;
  loadedCar = car; carLoaded = false;
  send({ type: 'load_scene', modelId: engineId(car) });
}

function sendPaint() {
  send({ type: 'set_paint', color: paint });
}
// The engine sizes its canvas from the iframe; nudge it whenever the layout changes
// or the car comes out stretched.
const nudge = () => frame.contentWindow && frame.contentWindow.postMessage({ type: 'force_resize' }, '*');
const nudgeSoon = () => [0, 100, 300, 600, 1000, 2000].forEach(t => setTimeout(nudge, t));
new ResizeObserver(nudgeSoon).observe(frame);
addEventListener('resize', nudgeSoon);
frame.addEventListener('load', nudgeSoon);
frame.addEventListener('load', () => { try { ['pointerdown', 'touchstart'].forEach(t => frame.contentWindow.addEventListener(t, () => { viewDirty = true; }, true)); } catch {} });
function pushTexture() {
  if (carLoaded && texture) send({ type: 'set_texture', texture });
}

// The engine renders each colour channel roughly as in^0.6 (measured), which turns
// burnt orange into amber. Pre-apply the inverse (^1/0.6) plus a small gain.
const LUT = Array.from({ length: 256 }, (_, v) => Math.min(255, Math.round(255 * 1.3 * Math.pow(v / 255, 1 / 0.6))));

// ---- wrap → 1024×1024 texture (matches the car's UV map) ----
function setWrap(img) {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0, 1024, 1024);
  rawTex = c.toDataURL('image/png');
  const im = x.getImageData(0, 0, 1024, 1024), p = im.data;
  for (let i = 0; i < p.length; i += 4) if (p[i + 3]) {
    p[i] = LUT[p[i]]; p[i + 1] = LUT[p[i + 1]]; p[i + 2] = LUT[p[i + 2]];
  }
  x.putImageData(im, 0, 0);
  fixedTex = c.toDataURL('image/png');
  texture = fixedTex;                    // always colour-corrected for the engine
  pushTexture();
}
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}

// ---- validation against Tesla's published rules ----
const templateCache = {};
async function printableMask(carId) {                      // Tesla's template: opaque white = printable panel
  if (!templateCache[carId]) templateCache[carId] = (async () => {
    const r = await fetch(`${RAW}/${carId}/template.png`); if (!r.ok) throw new Error('template ' + r.status);
    const img = await loadImage(URL.createObjectURL(await r.blob()));
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    const p = x.getImageData(0, 0, c.width, c.height).data, m = new Uint8Array(c.width * c.height);
    for (let i = 0; i < m.length; i++) m[i] = p[i * 4 + 3] > 200 && p[i * 4] > 200 ? 1 : 0;
    return { w: c.width, h: c.height, m };
  })();
  return templateCache[carId];
}
async function validate(file, carId = car) {
  const rows = [], stats = {};
  const add = (level, text) => rows.push({ level, text });
  const isPng = file.type === 'image/png' || /\.png$/i.test(file.name);
  add(isPng ? 'ok' : 'bad', isPng ? 'PNG file' : 'Must be a PNG');
  const base = file.name.replace(/\.png$/i, '');
  if (!/^[A-Za-z0-9_\- ]+$/.test(base) || base.length > 30)
    add('warn', 'File name should be letters, numbers, spaces, _ or - only, 30 characters max (Tesla\'s rule)');
  const kb = file.size / 1024;
  add(file.size <= 1048576 ? 'ok' : 'bad',
      `File size ${kb >= 1024 ? (kb / 1024).toFixed(2) + ' MB' : Math.round(kb) + ' KB'} (max 1 MB)`);
  const url = URL.createObjectURL(file);
  let img = null;
  try { img = await loadImage(url); } catch { add('bad', 'Could not read image'); }
  if (img) {
    const w = img.naturalWidth, h = img.naturalHeight, [tw, th] = templateSize(carId);
    stats.width = w; stats.height = h;
    const inRange = w >= 512 && h >= 512 && w <= 1024 && h <= 1024;
    add(inRange ? 'ok' : 'bad', `${w}×${h} px (must be 512–1024 each side)`);
    if (w / h !== tw / th) add('warn', `This car's template is ${tw}×${th}; yours is ${w}×${h} and will be stretched to fit`);
    try {                                                   // how much art lands on printable panels
      const t = await printableMask(carId);
      const c = document.createElement('canvas'); c.width = t.w; c.height = t.h;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, t.w, t.h);
      const p = x.getImageData(0, 0, t.w, t.h).data;
      let art = 0, outside = 0, covered = 0, printable = 0;
      for (let i = 0; i < t.m.length; i++) {
        const on = p[i * 4 + 3] > 40;
        if (t.m[i]) { printable++; if (on) covered++; } if (on) { art++; if (!t.m[i]) outside++; }
      }
      stats.coveragePct = +(100 * covered / printable).toFixed(1);
      stats.outsidePct = art ? +(100 * outside / art).toFixed(1) : 0;
      add(stats.coveragePct >= 3 ? 'ok' : 'warn', stats.coveragePct >= 3 ? `Covers ${stats.coveragePct}% of the printable panels` : `Covers only ${stats.coveragePct}% of the printable panels — the car will mostly show its base paint`);
      add(stats.outsidePct <= 15 ? 'ok' : 'warn', stats.outsidePct <= 5 ? 'Artwork stays on the panels' : `${stats.outsidePct}% of the artwork is outside the printable panels and will not appear on the car`);
    } catch { /* offline: skip the template comparison */ }
  }
  return { rows, img, url, stats };
}
function showChecks(rows) {
  $('checks').innerHTML = rows.map(r => `<li class="${r.level}"><span class="dot">${r.level === 'ok' ? '✓' : r.level === 'warn' ? '!' : '✕'}</span><span>${r.text}</span></li>`).join('');
  const bad = rows.some(r => r.level === 'bad'), warn = rows.some(r => r.level === 'warn');
  const v = $('verdict');
  v.textContent = bad ? 'Tesla will reject this file.' : warn ? 'Will upload, but check the notes above.' : 'Meets Tesla’s upload rules. Check the 3D view for placement.';
  v.style.color = bad ? 'var(--bad)' : warn ? 'var(--warn)' : 'var(--ok)';
}
async function handleFile(file, exampleBtn = null) {         // exampleBtn: the Tesla example thumbnail it came from, if any
  if (!file) return;
  document.querySelectorAll('#examples button').forEach(x => x.classList.toggle('on', x === exampleBtn));
  const { rows, img, url } = await validate(file);
  if (exampleBtn) { $('checks').innerHTML = ''; $('verdict').textContent = ''; }       // Tesla's own files: no summary
  else showChecks(rows);
  if (img) {
    setWrap(img);
    currentShare = exampleBtn ? { example: exampleBtn.dataset.n } : { file }; showShare();
    if (exampleBtn) {                                          // the highlighted thumbnail is the picture; no big preview
      $('preview').hidden = true; $('drop').firstElementChild.textContent = dropText(false); currentShare = null; showShare();
    } else {
      $('previewImg').src = url; $('previewName').textContent = file.name; $('preview').hidden = false;
      $('drop').firstElementChild.textContent = dropText(true);
    }
  }
}

// ---- sharing ----
// Wraps are encrypted in the browser (AES-GCM) before upload; the key lives only in the link's #fragment, which is never sent to any server,
// so the share service holds unreadable bytes. If no service is configured, small wraps travel inside the link itself.
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const SHARE_URL = ((LOCAL && P.get('share')) || SHARE_URL_DEFAULT).replace(/\/$/, '');
const b64u = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = str => Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const baseUrl = () => location.origin + location.pathname;
let currentShare = null;                       // { file } for an uploaded wrap, { example } for a Tesla example

async function encryptWrap(file) {
  const png = new Uint8Array(await file.arrayBuffer());
  const head = new TextEncoder().encode(JSON.stringify({ car, name: file.name }));
  const plain = new Uint8Array(2 + head.length + png.length); plain[0] = head.length >> 8; plain[1] = head.length & 255; plain.set(head, 2); plain.set(png, 2 + head.length);
  const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return { bytes: out, key: b64u(await crypto.subtle.exportKey('raw', key)) };
}
async function decryptWrap(buf, keyStr) {
  const key = await crypto.subtle.importKey('raw', unb64u(keyStr), 'AES-GCM', false, ['decrypt']);
  const data = new Uint8Array(buf), plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12)));
  const n = (plain[0] << 8) | plain[1], head = JSON.parse(new TextDecoder().decode(plain.slice(2, 2 + n)));
  return { car: head.car, file: new File([plain.slice(2 + n)], head.name || 'Shared wrap.png', { type: 'image/png' }) };
}
async function shrinkForLink(file) {            // no share service: fit the wrap into the link (soft, lossy)
  const img = await loadImage(URL.createObjectURL(file)), [tw, th] = templateSize(car), k = 384 / Math.max(tw, th);
  const c = document.createElement('canvas'); c.width = Math.round(tw * k); c.height = Math.round(th * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.6));
  return new Uint8Array(await blob.arrayBuffer());
}
async function makeShareLink() {
  if (!currentShare) throw new Error('Load a wrap first');
  const vw = '&view=' + (currentView || DEFAULT_VIEW);                    // open the link at the last angle picked (or the page's default)
  if (currentShare.example) return { link: `${baseUrl()}#car=${car}&ex=${encodeURIComponent(currentShare.example)}${vw}`, note: 'Tesla example: the link just names it.' };
  if (SHARE_URL) {
    const { bytes, key } = await encryptWrap(currentShare.file);
    const r = await fetch(SHARE_URL + '/', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: bytes });
    if (!r.ok) throw new Error(r.status === 413 ? 'That file is too large to share.' : 'The share service said no (' + r.status + ').');
    const { id, expiresInDays } = await r.json();
    return { link: `${baseUrl()}#s=${id}.${key}${vw}`, note: `Encrypted in your browser. Works for ${expiresInDays} days.` };
  }
  const small = await shrinkForLink(currentShare.file), data = b64u(small);
  if (data.length > 70000) throw new Error('Too big for a link. Use "Send PNG" instead.');
  return { link: `${baseUrl()}#d=${car}.${data}${vw}`, note: 'The image is inside the link (softened to fit), so it is stored nowhere.' };
}
function showShare() { $('shareRow').hidden = !currentShare; $('sharePng').hidden = !currentShare || !!currentShare.example; $('shareMsg').textContent = ''; $('shareMsg').className = ''; }
function say(t, err) { $('shareMsg').textContent = t; $('shareMsg').className = err ? 'err' : ''; }
$('shareLink').onclick = async () => {
  const b = $('shareLink'); b.disabled = true; say('Making link…');
  try {
    const { link, note } = await makeShareLink();
    const spinNote = currentView === 'rotate' ? ' It opens with the car slowly rotating.' : '', label = (VIEWS[currentView || DEFAULT_VIEW] || {}).label || 'chosen', drag = viewDirty ? ` It opens at the ${label} angle; an angle you dragged to by hand can't be saved, so pick one of the angle buttons to choose.` : '';
    try { await navigator.clipboard.writeText(link); say('Link copied. ' + note + spinNote + drag); } catch { prompt('Copy this link:', link); say(note + spinNote + drag); }
  } catch (e) { say(e.message, true); } finally { b.disabled = false; }
};
$('sharePng').onclick = async () => {
  const f = currentShare && currentShare.file; if (!f) return;
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: f.name }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click();
};
// Opens #s=<id>.<key> (stored, encrypted), #d=<car>.<data> (inside the link) and #car=<id>&ex=<name> (Tesla example).
async function resolveHash() {
  const h0 = location.hash.slice(1); if (!h0) return null;
  const hv = validView(new URLSearchParams(h0.slice(h0.indexOf('&') + 1)).get('view')); if (hv && h0.includes('&')) pendingView = hv;
  const h = h0.split('&')[0].startsWith('car=') ? h0 : h0.split('&')[0];     // car=..&ex=.. keeps its params; s=/d= links lose the &view= tail
  try {
    if (h.startsWith('s=')) {
      if (!SHARE_URL) throw new Error('This link needs the share service, which is not set up on this copy of the site.');
      const [id, key] = h.slice(2).split('.');
      const r = await fetch(`${SHARE_URL}/${id}`); if (!r.ok) throw new Error(r.status === 404 ? 'This shared wrap has expired or does not exist.' : 'Could not load the shared wrap.');
      const { car: c, file } = await decryptWrap(await r.arrayBuffer(), key); if (CARS.some(x => x.id === c)) car = c; return { file };
    }
    if (h.startsWith('d=')) {
      const [c, data] = [h.slice(2, h.indexOf('.')), h.slice(h.indexOf('.') + 1)]; if (CARS.some(x => x.id === c)) car = c;
      const bytes = unb64u(data), webp = bytes[8] === 0x57 && bytes[9] === 0x45;       // "WEBP" magic at offset 8
      return { file: new File([bytes], 'Shared wrap.' + (webp ? 'webp' : 'png'), { type: webp ? 'image/webp' : 'image/png' }) };
    }
    const q = new URLSearchParams(h);
    if (q.get('car') && CARS.some(x => x.id === q.get('car'))) car = q.get('car');
    if (q.get('ex')) return { example: q.get('ex') };
  } catch (e) { return { error: e.message || 'This link could not be opened.' }; }
  return null;
}

// ---- UI wiring ----
const drop = $('drop'), fileIn = $('file');
drop.onclick = () => fileIn.click();
$('preview').onclick = () => fileIn.click();
fileIn.onchange = () => handleFile(fileIn.files[0]);
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });

function renderCars() {
  const groups = [...new Set(CARS.map(c => c.group))];
  $('cars').innerHTML = groups.map(g => `<optgroup label="${g}">` + CARS.filter(c => c.group === g).map(c =>
    `<option value="${c.id}">${c.name.startsWith(g) ? c.name : `${g} ${c.name}`} · ${c.sub.replace(/ \(.*\)/, '')}</option>`).join('') + '</optgroup>').join('');
  $('cars').value = car;
}
$('cars').onchange = () => switchCar($('cars').value);
function switchCar(id) {
  if (id === car) return;
  car = id; store.set('car', car);
  renderCars(); renderExamples();
  $('status').classList.remove('hide'); $('statusText').textContent = `Loading ${carName(car)}…`; $('statusHint').textContent = '';
  $('checks').innerHTML = ''; $('verdict').textContent = ''; texture = null; rawTex = fixedTex = null;
  $('preview').hidden = true; $('drop').firstElementChild.textContent = dropText(false);
  if (packOf(car) !== loadedPack) loadViewer(); else syncCar();
}
function renderExamples() {
  $('examples').innerHTML = examplesFor(car).map(n => `<button data-n="${n}" title="${n.replace(/_/g, ' ')}"><img loading="lazy" src="${RAW}/${car}/example/${n}.png"><span>${n.replace(/_/g, ' ')}</span></button>`).join('');
  $('examples').querySelectorAll('button').forEach(b => b.onclick = async () => {
    b.classList.add('on');
    const blob = await (await fetch(`${RAW}/${car}/example/${b.dataset.n}.png`)).blob();
    handleFile(new File([blob], b.dataset.n + '.png', { type: 'image/png' }), b);
  });
}
const markView = k => $('bar').querySelectorAll('[data-cam]').forEach(x => x.classList.toggle('on', x.dataset.cam === k));
const validView = v => (v && BAR.includes(v) ? v : (v === 'three_quarter' || v === 'rotate' ? v : null));
$('bar').innerHTML = BAR.map(k => `<button data-cam="${k}">${VIEWS[k].label}</button>`).join('') + '<button id="spin">Rotate</button>';
$('bar').querySelectorAll('[data-cam]').forEach(b => b.onclick = () => {
  $('spin').classList.remove('on'); spinning = false;
  currentView = b.dataset.cam; markView(currentView);
  WrapCheck.camera(currentView);
});
$('spin').onclick = () => {
  spinning = !spinning; $('spin').classList.toggle('on', spinning); markView(null);
  currentView = spinning ? 'rotate' : null;        // shared links then open already rotating
  viewDirty = !spinning;                           // switched off: the car stopped at an angle we can't name
  send({ type: 'set_camera_auto_rotate', enabled: spinning });
};

$('drop').firstElementChild.textContent = dropText(false); if (TOUCH) $('dropSub').hidden = true;
renderExamples();
initialView = validView(pendingView);
if (initialView === 'rotate') { spinning = true; currentView = 'rotate'; $('spin').classList.add('on'); }
fetch('godot/packs/manifest.json').then(r => r.json()).catch(() => ({})).then(async m => {
  manifest = m;
  const shared = await resolveHash();                  // may switch `car` (and the starting view) before the engine starts
  initialView = validView(pendingView);
  if (initialView === 'rotate') { spinning = true; currentView = 'rotate'; $('spin').classList.add('on'); }
  renderCars(); renderExamples(); if (!P.get('noengine')) loadViewer();     // noengine: validation-only page
  if (shared && shared.error) say(shared.error, true);
  else if (shared && shared.file) handleFile(shared.file);
  else if (shared && shared.example) { const b = document.querySelector(`#examples button[data-n="${CSS.escape(shared.example)}"]`); if (b) b.click(); }
  else if (P.get('wrap')) fetch(P.get('wrap')).then(r => r.blob()).then(b => handleFile(new File([b], (P.get('wrap').split('/').pop() || 'wrap.png').split('?')[0], { type: 'image/png' }))).catch(() => {});
});

// ---- scripting API: used by the headless renderer / MCP server, and handy in the console ----
const sleep = ms => new Promise(r => setTimeout(r, ms));
const waitFor = async (pred, ms, what) => { const t0 = Date.now(); while (!pred()) { if (Date.now() - t0 > ms) throw new Error('timed out waiting for ' + what); await sleep(100); } };
const b64ToFile = (b64, name) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new File([u], name, { type: 'image/png' }); };
window.WrapCheck = {
  cars: CARS.map(c => ({ id: c.id, name: carName(c.id), pack: c.pack, template: `${RAW}/${c.id}/template.png`, templateSize: templateSize(c.id), examples: examplesFor(c.id) })),
  share: async () => (await makeShareLink()).link,
  state: () => ({ car, carLoaded, ready, pack: loadedPack, hasWrap: !!texture, events: engineEvents.slice(-20), sent: sentLog.slice() }),
  async setCar(id, ms = 120000) {
    if (!CARS.some(c => c.id === id)) throw new Error('unknown car ' + id);
    switchCar(id); await waitFor(() => carLoaded && loadedCar === id, ms, 'car to load');
  },
  async validate(b64, name, carId = car) { const r = await validate(b64ToFile(b64, name), carId); return { rows: r.rows, stats: r.stats }; },
  async setWrap(b64, name = 'wrap.png') {
    const r = await validate(b64ToFile(b64, name), car); if (!r.img) throw new Error('image could not be decoded');
    setWrap(r.img); await sleep(900); return { rows: r.rows, stats: r.stats };
  },
  async setPaint(color) { paint = color; sendPaint(); pushTexture(); await sleep(400); },
  async camera(preset, settleMs = 1600) {
    spinning = false; viewDirty = false; send({ type: 'set_camera_auto_rotate', enabled: false });
    const v = VIEWS[preset] || VIEWS.three_quarter;
    send(v.preset ? { type: 'set_camera_preset', preset: v.preset } : { type: 'set_camera_angle', horizontal: v.h, vertical: 15, distance: fitDistance() });
    await sleep(settleMs);
  },
};
